<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">5.18<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>A unit test for rollDie with numSides = 6<div class="autopermalink" aria-hidden="true" data-description="Listing 5.18: A unit test for rollDie with numSides = 6"><a tabindex="-1" href="#listing-test-roll-die" title="Copy heading and permalink for Listing 5.18: A unit test for rollDie with numSides = 6" aria-label="Copy heading and permalink for Listing 5.18: A unit test for rollDie with numSides = 6">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable"><code class="language-java">/**
 * Unit test driver for DiceGame.rollDie(6).
 * Verifies that a 6-sided die never generates out-of-bounds values
 * and that all six faces are reachable over 1,000 rolls.
 */
public class TestRollDie {

    public static void main(String[] args) {
        System.out.println("Running unit test for rollDie(6)...
");

        final int SIDES = 6;
        final int ROLLS = 1000;

        boolean seen1 = false;
        boolean seen2 = false;
        boolean seen3 = false;
        boolean seen4 = false;
        boolean seen5 = false;
        boolean seen6 = false;

        int outOfBoundsCount = 0;

        // Roll the die 1,000 times
        for (int i = 0; i &lt; ROLLS; i++) {
            int roll = DiceGame.rollDie(SIDES);

            // 1. Boundary check: ensure no roll falls outside [1, 6]
            if (roll &lt; 1 || roll &gt; SIDES) {
                outOfBoundsCount++;
                System.out.println("FAIL: Out-of-bounds roll generated: " + roll);
            }

            // 2. Reachability tracking: record which numbers appear
            if (roll == 1) {
                seen1 = true;
            } else if (roll == 2) {
                seen2 = true;
            } else if (roll == 3) {
                seen3 = true;
            } else if (roll == 4) {
                seen4 = true;
            } else if (roll == 5) {
                seen5 = true;
            } else if (roll == 6) {
                seen6 = true;
            } // if
        } // for

        // Evaluate whether every face appeared at least once
        boolean allFacesSeen = seen1 &amp;&amp; seen2 &amp;&amp; seen3 &amp;&amp; seen4 &amp;&amp; seen5 &amp;&amp; seen6;

        // Display results breakdown
        System.out.println("Results for " + ROLLS + " rolls of a d" + SIDES + ":");
        System.out.println("  Face 1 appeared: " + seen1);
        System.out.println("  Face 2 appeared: " + seen2);
        System.out.println("  Face 3 appeared: " + seen3);
        System.out.println("  Face 4 appeared: " + seen4);
        System.out.println("  Face 5 appeared: " + seen5);
        System.out.println("  Face 6 appeared: " + seen6);

        // Final verdict
        System.out.println();
        if (outOfBoundsCount == 0 &amp;&amp; allFacesSeen) {
            System.out.print("ALL TESTS PASSED: rollDie(6) is strictly bounded ");
            System.out.println("and all faces are reachable.");
        } else {
            System.out.println("TEST RUN FAILED.");
            if (outOfBoundsCount &gt; 0) {
                System.out.println("  " + outOfBoundsCount + " roll(s) were out of bounds.");
            }
            if (!allFacesSeen) {
                System.out.println("  One or more die faces were never rolled.");
            }
        }
    }
}
