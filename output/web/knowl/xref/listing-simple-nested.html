 * Illustrates a nested loop.
 */
public class SimpleNested {
 
    public static void main(String[] args) {
        int row = 0;
        while (row &lt; 3) {        // Outer loop
            int col = 0;
            while (col &lt; 4) {     // Inner loop
                System.out.println(row + ", " + col);
                col++;
            } // inner while
            row++;
        } // outer while
    }
}
