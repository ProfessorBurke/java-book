<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.19<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span><code class="code-inline tex2jax_ignore">AqiFileReader.java</code><div class="autopermalink" aria-hidden="true" data-description="Listing 4.19: AqiFileReader.java"><a tabindex="-1" href="#listing-aqi-file-reader" title="Copy heading and permalink for Listing 4.19: AqiFileReader.java" aria-label="Copy heading and permalink for Listing 4.19: AqiFileReader.java">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-java">import java.util.Scanner;
import java.io.File;
import java.io.FileNotFoundException;
 
/**
 * Reads and prints AQI and location data from a file.
 */
public class AqiFileReader {
 
    public static void main(String[] args) throws FileNotFoundException {
        
        File cityFile;       // The file with city data.
        Scanner fileScanner;  // For reading city data.
        String name;               // City name.
        double latitude, longitude;  // City location.
        int aqi;                   // City air quality.
        
        // Reads the city data from the file.
        cityFile = new File("aqi_data.txt");
        if (!cityFile.exists()) {
            System.out.println("The file was not found.");
        } else {
            fileScanner = new Scanner(cityFile);
            while (fileScanner.hasNext()) {
                // Reads the data for the next city.
                name = fileScanner.nextLine();
                latitude = fileScanner.nextDouble();
                longitude = fileScanner.nextDouble();
                aqi = fileScanner.nextInt();
 
                // Consumes the newline if more data follows.
                if (fileScanner.hasNext()) {
                    fileScanner.nextLine();
                }
 
                // Displays the city data to the console.
                System.out.printf("%-20s%s%n", "Name:", name);
                System.out.printf("%-20s%f%n", "Latitude:", latitude);
                System.out.printf("%-20s%f%n", "Longitude:", longitude);
                System.out.printf("%-20s%d%n", "AQI:", aqi);
            } // while
            fileScanner.close();
        } // else (file exists)
    } // main
} // class
</code></pre></div></div>
