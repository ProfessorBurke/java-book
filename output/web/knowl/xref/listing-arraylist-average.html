<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.21<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Averaging values in an <code class="code-inline tex2jax_ignore">ArrayList</code>.<div class="autopermalink" aria-hidden="true" data-description="Listing 7.21: Averaging values in an ArrayList."><a tabindex="-1" href="#listing-arraylist-average" title="Copy heading and permalink for Listing 7.21: Averaging values in an ArrayList." aria-label="Copy heading and permalink for Listing 7.21: Averaging values in an ArrayList.">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-java">import java.util.ArrayList;

public class ProcessReadingsArrayList {

    public static void main(String[] args) {
        // Holds a week of AQI readings.
        ArrayList&lt;Integer&gt; readings = new ArrayList&lt;&gt;();

        // Adds seven readings to the ArrayList.
        readings.add(45);
        readings.add(68);
        readings.add(112);
        readings.add(85);
        readings.add(38);
        readings.add(142);
        readings.add(55);

        // Totals the readings.
        int total = 0;
        for (int reading : readings) {
            total += reading;
        }

        // Displays the average AQI reading for the week.
        System.out.printf("The average AQI is %.1f.%n", (double)total / readings.size());
    }
}
