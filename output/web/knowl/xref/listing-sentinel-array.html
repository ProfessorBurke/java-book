<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.16<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Obtaining array values in a sentinel loop<div class="autopermalink" aria-hidden="true" data-description="Listing 7.16: Obtaining array values in a sentinel loop"><a tabindex="-1" href="#listing-sentinel-array" title="Copy heading and permalink for Listing 7.16: Obtaining array values in a sentinel loop" aria-label="Copy heading and permalink for Listing 7.16: Obtaining array values in a sentinel loop">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-java">import java.util.Scanner;
import java.util.Arrays;

/**
 * Obtains and stores up to MAX_SCORES scores.
 */
public class SentinelArray {

    public static void main(String[] args) {

        // The maximum number of scores that can be stored.
        final int MAX_SCORES = 5;

        Scanner stdin;    // To obtain scores.
        int score;        // Score OR the sentinel.
        int count = 0;    // The actual number of scores entered.

        // To hold the obtained scores.
        int[] scores = new int[MAX_SCORES];

        // Priming read: read the first score.
        stdin = new Scanner(System.in);
        System.out.print("Enter score (-1 to stop): ");
        score = stdin.nextInt();

        // Obtains scores as long as the sentinel isn't entered
        // and we haven't filled the array.
        while (score != -1 &amp;&amp; count &lt; scores.length) {
            // Adds the score into the current location in the array.
            scores[count] = score;
            count++;

            // Obtains the next score or sentinel only
            // if we haven't filled the array.
            if (count &lt; scores.length) {
                System.out.print("Enter score (-1 to stop): ");
                score = stdin.nextInt();
            }
        }
        stdin.close();

        // Displays the number of scores entered and the scores array.
        System.out.println("Number of scores stored: " + count);
        System.out.println(Arrays.toString(scores));
    }
}
