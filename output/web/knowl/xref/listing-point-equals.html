<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.31<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>An <code class="code-inline tex2jax_ignore">equals</code> method for the <code class="code-inline tex2jax_ignore">Point</code> class<div class="autopermalink" aria-hidden="true" data-description="Listing 6.31: An equals method for the Point class"><a tabindex="-1" href="#listing-point-equals" title="Copy heading and permalink for Listing 6.31: An equals method for the Point class" aria-label="Copy heading and permalink for Listing 6.31: An equals method for the Point class">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-java">/**
 * Indicates whether some other object is "equal to" this Point.
 * Two points are considered equal if they are the exact same instance,
 * or if the other object is also a Point with identical x and y coordinates.
 *
 * Precondition: None (obj may be null or any object type).
 * Postcondition: Returns true if obj is an instance of Point with coordinates
 *                matching this point; false otherwise. The state of this Point
 *                and obj are unchanged.
 *
 * @param obj the reference object with which to compare
 * @return true if this Point is equal to the obj argument; false otherwise
 */
@Override
public boolean equals(Object obj) {
    boolean equal = false;
    if (this == obj) {
        // Check if obj is the exact same instance as this
        equal = true;
    } else if (obj != null &amp;&amp; obj.getClass() == this.getClass()) {
        // If the object exists and is of the same class, compare fields
        Point other = (Point) obj;
        equal = (Double.compare(this.x, other.x) == 0 
                 &amp;&amp; Double.compare(this.y, other.y) == 0);
    }
    return equal;
}
